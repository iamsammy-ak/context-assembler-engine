# Demo scenario: a customer-support copilot for a fictional invoicing product ("Lumen Ledger").
# Every company, person, number and help-centre article below is invented for the demo.
title: Billing-support copilot (fictional)
model: generic-8k

system: >-
  You are Ledger Assist, the customer-support copilot for Lumen Ledger, a subscription invoicing
  platform for small agencies. You answer billing and account questions using the help-centre
  extracts, the customer's account memory and the tools provided. Be exact about amounts, dates and
  policy, and say so when you are not sure.

instructions:
  - id: cite-sources
    text: Cite help-centre extracts by their id in square brackets, for example [kb-refunds#2].
    required: true
  - id: confirm-writes
    text: >-
      Before calling a tool that changes billing data (refunds, credit notes, plan or billing-detail
      changes), restate the exact action and wait for the customer's explicit confirmation.
    required: true
  - id: refund-limit
    text: Refunds above EUR 500 need billing-team approval, so escalate them instead of refunding.
    score: 0.9
  - id: privacy
    text: Never reveal full card or bank numbers; refer to the last four digits only.
    score: 0.7
  - id: tone
    text: Be warm and concise, at most 150 words unless the customer asks for more detail.
    score: 0.5

tools:
  - name: get_customer
    description: >-
      Look up a customer account by workspace id. Returns the legal name, plan, billing currency,
      billing address, VAT number and contacts. Use this before any billing change to confirm the account.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id, e.g. ws_48213.", examples: ["ws_48213"]}
      required: [workspace_id]
  - name: list_invoices
    description: >-
      List a customer's invoices, newest first, with number, date, amount, status and the payment
      attempts behind each one. Filter by status to find unpaid or refunded invoices.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        status: {type: string, enum: [any, paid, open, refunded, void], default: any, description: "Invoice status filter."}
        limit: {type: integer, minimum: 1, maximum: 50, default: 10, description: "Maximum invoices to return."}
      required: [workspace_id]
  - name: get_invoice
    description: >-
      Fetch one invoice with its line items, tax breakdown, payment attempts and the event that
      created it (subscription change, retry, manual). Use it to explain a charge.
    parameters:
      type: object
      properties:
        invoice_id: {type: string, description: "Invoice number, e.g. INV-2304.", examples: ["INV-2304"]}
      required: [invoice_id]
  - name: issue_refund
    description: >-
      Refund all or part of a paid invoice to the original payment method. Refunds of duplicate
      charges are always full. Agents may refund up to EUR 500 without approval. Only call this after
      the customer has confirmed the invoice, the amount and the refund destination.
    parameters:
      type: object
      properties:
        invoice_id: {type: string, description: "Invoice to refund, e.g. INV-2304.", examples: ["INV-2304"]}
        amount: {type: number, exclusiveMinimum: 0, description: "Amount to refund in the invoice currency."}
        currency: {type: string, enum: [EUR, GBP, USD], description: "Invoice currency."}
        reason: {type: string, enum: [duplicate, service_issue, goodwill, other], description: "Refund reason for reporting."}
        note: {type: string, description: "Internal note shown to the billing team.", examples: ["Duplicate retry charge"]}
      required: [invoice_id, amount, currency, reason]
  - name: create_credit_note
    description: >-
      Issue a credit note against an invoice instead of a cash refund. The credit is applied to the
      customer's next invoices. Use it when the customer prefers account credit.
    parameters:
      type: object
      properties:
        invoice_id: {type: string, description: "Invoice the credit note corrects."}
        amount: {type: number, exclusiveMinimum: 0, description: "Credit amount in the invoice currency."}
        reason: {type: string, description: "Reason printed on the credit note."}
      required: [invoice_id, amount, reason]
  - name: update_billing_details
    description: >-
      Change the legal name, billing address or VAT number on a customer's billing profile. Changes
      apply to new invoices; regenerate past invoices separately.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        legal_name: {type: string, description: "Registered company name printed on invoices."}
        vat_number: {type: string, description: "EU VAT number including the country prefix.", examples: ["NL859245613B01"]}
        address:
          type: object
          description: Billing address.
          properties:
            line1: {type: string, description: "Street and number."}
            city: {type: string, description: "City."}
            postcode: {type: string, description: "Postal code."}
            country: {type: string, description: "ISO 3166-1 alpha-2 country code.", examples: ["NL"]}
      required: [workspace_id]
  - name: regenerate_invoice
    description: >-
      Re-issue an existing invoice using the current billing profile (legal name, address, VAT
      number). The invoice number stays the same, the PDF is replaced and accounting integrations are
      updated. Allowed for invoices issued in the last 12 months.
    parameters:
      type: object
      properties:
        invoice_id: {type: string, description: "Invoice to regenerate."}
        send_copy: {type: boolean, default: true, description: "Email the new PDF to the billing contact."}
      required: [invoice_id]
  - name: retry_payment
    description: >-
      Retry collection of an open invoice immediately using the default payment method. Do not use it
      on paid invoices.
    parameters:
      type: object
      properties:
        invoice_id: {type: string, description: "Open invoice to collect."}
      required: [invoice_id]
  - name: change_plan
    description: >-
      Move a subscription to another plan. Upgrades take effect immediately with a prorated charge;
      downgrades take effect at the end of the billing period.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        plan: {type: string, enum: [starter, growth, scale, enterprise], description: "Target plan."}
        seats: {type: integer, minimum: 1, description: "Number of paid seats after the change."}
      required: [workspace_id, plan]
  - name: cancel_subscription
    description: >-
      Cancel a subscription, either at the end of the current billing period or immediately with a
      prorated credit. Requires the cancellation reason for churn reporting.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        at_period_end: {type: boolean, default: true, description: "Cancel when the paid period ends."}
        reason: {type: string, description: "Why the customer is cancelling."}
      required: [workspace_id, reason]
  - name: search_help_center
    description: >-
      Search the public help centre and return the most relevant article extracts with their ids, for
      questions not covered by the extracts already provided.
    parameters:
      type: object
      properties:
        query: {type: string, description: "Search query in plain words."}
        limit: {type: integer, minimum: 1, maximum: 10, default: 5, description: "Number of extracts."}
      required: [query]
  - name: escalate_to_billing_team
    description: >-
      Hand a case to the human billing team, for example refunds above the agent limit, disputes or
      chargebacks. The team replies to the customer by email within one business day.
    parameters:
      type: object
      properties:
        summary: {type: string, description: "What happened and what the customer wants."}
        priority: {type: string, enum: [low, normal, high], default: normal, description: "Urgency."}
        invoice_ids: {type: array, items: {type: string}, description: "Invoices involved."}
      required: [summary]
  - name: send_customer_email
    description: >-
      Email the customer's billing contact, for example to confirm an action or share a document.
      Use a short subject and plain text.
    parameters:
      type: object
      properties:
        subject: {type: string, description: "Email subject."}
        body: {type: string, description: "Plain-text email body."}
      required: [subject, body]
  - name: get_payment_methods
    description: >-
      List the stored payment methods for a workspace with brand, last four digits, expiry date and
      which one is the default. Full card numbers are never returned.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
      required: [workspace_id]
  - name: add_billing_contact
    description: >-
      Add an email address to the workspace's billing contacts so it receives invoices, receipts and
      refund confirmations. Billing contacts do not use a seat.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        email: {type: string, format: email, description: "Address to add.", examples: ["accounts@example.com"]}
        name: {type: string, description: "Contact name shown on emails."}
      required: [workspace_id, email]
  - name: export_time_report
    description: >-
      Export the hours-by-client report for a month as CSV or PDF and return a download link valid
      for 24 hours.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        month: {type: string, pattern: "^[0-9]{4}-[0-9]{2}$", description: "Month as YYYY-MM.", examples: ["2026-10"]}
        format: {type: string, enum: [csv, pdf], default: csv, description: "File format."}
      required: [workspace_id, month]
  - name: apply_coupon
    description: >-
      Apply a promotional coupon code to a subscription. Coupons affect future invoices only and cannot
      be combined with each other.
    parameters:
      type: object
      properties:
        workspace_id: {type: string, description: "Workspace id of the customer."}
        code: {type: string, description: "Coupon code exactly as issued."}
      required: [workspace_id, code]

