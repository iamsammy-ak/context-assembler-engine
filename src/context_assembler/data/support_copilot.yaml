retrieved:
  - id: kb-double-charges#1
    score: 0.91
    text: >-
      Why was I charged twice? A second charge for the same amount usually comes from a payment retry.
      When a card payment is declined, Lumen Ledger retries it automatically after a short delay. If the
      bank later approves the first attempt as well, the retry can create a second paid invoice for the
      same subscription change. You will then see two invoices with different numbers but the same
      amount and description. These duplicates are always refunded in full to the original payment
      method, and the duplicate invoice is voided so that it no longer appears in your accounting
      integration. Support can confirm a duplicate by comparing the payment attempts on both invoices:
      a duplicate has the same card, the same amount and a retry flag on the second attempt.
  - id: kb-double-charges#1-mirror
    score: 0.9
    text: >-
      Why was I charged twice? A second charge for the same amount usually comes from a payment retry.
      When a card payment is declined, Lumen Ledger retries it automatically after a short delay. If the
      bank later approves the first attempt as well, the retry can create a second paid invoice for the
      same subscription change. You will then see two invoices with different numbers but the same
      amount and description. These duplicates are always refunded in full to the original payment
      method, and the duplicate invoice is voided so that it no longer appears in your accounting
      integration.
  - id: kb-refunds#2
    score: 0.88
    text: >-
      Refund policy. Duplicate charges and charges made after a cancellation date are refunded in full,
      with no questions asked. Refunds always go back to the original payment method; we cannot send
      money to a different card or bank account. Customers who would rather keep the money on their
      account can receive a credit note instead, which is applied to future invoices. Support agents can
      issue refunds of up to EUR 500 per invoice themselves; larger refunds are reviewed and approved by
      the billing team within one business day. Partial refunds are not available for downgrades or
      seat reductions, because those take effect at the end of the billing period rather than
      immediately.
  - id: kb-refunds-archive#2
    score: 0.86
    text: >-
      Refund policy. Duplicate charges and charges made after a cancellation date are refunded in full,
      with no questions asked. Refunds always go back to the original payment method; we cannot send
      money to a different card or bank account. Customers who would rather keep the money on their
      account can receive a credit note instead, which is applied to future invoices. Support agents can
      issue refunds of up to EUR 500 per invoice themselves; larger refunds are reviewed and approved by
      the billing team within one business day.
  - id: kb-vat-invoices#1
    score: 0.84
    text: >-
      Adding a VAT number. Business customers in the EU can add their VAT number under Settings,
      Billing, Tax details. Lumen Ledger validates the number against the EU VIES service before saving
      it, so make sure the country prefix is included. From then on, new invoices apply the
      reverse-charge mechanism and show your VAT number together with the text "VAT reverse charged".
      Invoices issued in the last 12 months can be regenerated on request using the new details; the
      invoice number and date do not change, only the customer details and the tax lines. Invoices
      older than 12 months cannot be changed because they have already been reported.
  - id: kb-reverse-charge#2
    score: 0.62
    text: >-
      Reverse charge explained. Lumen Ledger is registered for VAT in Ireland. For business customers in
      other EU countries with a valid VAT number, we do not charge VAT; instead the customer accounts for
      it in their own VAT return. Without a valid VAT number we must charge Irish VAT at the standard
      rate. If VAT was charged before you added your number, regenerating the invoice removes the VAT
      line and the difference is returned as a credit note, not as a card refund.
  - id: kb-proration#1
    score: 0.79
    text: >-
      How proration works. When you upgrade in the middle of a billing period, you pay only for the
      remaining time on the new plan, minus the unused time on your old plan. The prorated amount is
      charged immediately on a separate invoice, so your next renewal invoice is unchanged. Annual plans
      are prorated by day and monthly plans by second. Adding seats works the same way unless you choose
      to add them to your next invoice instead. Removing seats is never prorated: the reduction applies
      from the next renewal.
  - id: kb-refund-timelines#1
    score: 0.74
    text: >-
      How long do refunds take? Card refunds are sent to your bank immediately, but banks usually take
      5 to 10 business days to show them on a statement, and some business cards take longer at
      month-end. SEPA Direct Debit refunds take 3 to 5 business days. You receive an email with a refund
      reference as soon as the refund is issued; quote that reference if you contact your bank. If the
      refund has not arrived after 10 business days, contact support with the reference and we will
      ask the payment processor for a trace.
  - id: kb-credit-notes#1
    score: 0.72
    text: >-
      Credit notes versus refunds. A credit note reduces what you owe on future invoices instead of
      returning money to your card. Credit notes never expire while your subscription is active and are
      applied automatically to the next invoice, before any payment is taken. They appear in your
      accounting integration as a separate document linked to the original invoice. If you cancel your
      subscription, unused credit is refunded on request.
  - id: kb-failed-payments#3
    score: 0.66
    text: >-
      Failed payments. If a payment fails, we retry after 1, 3 and 5 days and email the billing contact
      each time. You can update your card at any time and retry immediately from the Billing page. In
      rare cases a bank approves a payment late, after a retry has already succeeded; this is the main
      cause of duplicate charges and is refunded in full. After the last failed retry the workspace
      switches to read-only until the invoice is paid.
  - id: kb-invoice-pdf#1
    score: 0.63
    text: >-
      Regenerating invoice PDFs. If your company name, address or VAT number was wrong, update your
      billing profile first and then ask support to regenerate the affected invoices. The new PDF
      replaces the old one, keeps the same invoice number and is emailed to your billing contacts.
      Connected accounting tools receive the updated invoice automatically, so there is nothing to
      delete by hand.
  - id: kb-payment-methods#2
    score: 0.58
    text: >-
      Payment methods. Lumen Ledger accepts Visa, Mastercard and American Express cards, and SEPA Direct
      Debit for EUR accounts. You can store one default and one backup method. The backup is used
      automatically if the default fails twice in a row. Card details are stored by our payment
      processor; support can only see the brand, the expiry date and the last four digits.
  - id: kb-billing-contacts#1
    score: 0.55
    text: >-
      Billing contacts. Invoices, receipts and refund confirmations are emailed to every billing contact
      on the workspace. Owners can add up to five billing contacts under Settings, Billing, Contacts, for
      example an external accountant. Billing contacts do not need a seat and cannot see client work.
  - id: kb-plan-changes#4
    score: 0.51
    text: >-
      Changing plans. Upgrades are immediate and prorated. Downgrades are scheduled for the end of the
      current billing period, so you keep the features you paid for until then. Seat reductions follow
      the same rule. You can cancel a scheduled downgrade at any time before it takes effect.
  - id: kb-currency#1
    score: 0.44
    text: >-
      Billing currency. The currency is set when you first subscribe and cannot be changed during a
      subscription. To switch currency, cancel at the end of the period and start a new subscription in
      the new currency; your data stays in place.
  - id: kb-cancellation#2
    score: 0.39
    text: >-
      Cancelling. You can cancel at any time from the Billing page. Cancellation takes effect at the end
      of the paid period and the workspace stays fully usable until then. Charges made after a
      cancellation date are refunded in full.
  - id: kb-xero-sync#1
    score: 0.35
    text: >-
      Xero sync. Finalised invoices, credit notes and refunds are pushed to Xero within a few minutes.
      Regenerated invoices replace the earlier version in Xero, and voided invoices are marked as voided
      there too. If the sync fails, the Integrations page shows the error and a retry button.
  - id: kb-sso#1
    score: 0.22
    text: >-
      Single sign-on. SAML single sign-on with Okta, Microsoft Entra ID and Google Workspace is available
      on the Enterprise plan. Contact sales to enable it for your workspace.

history:
  - role: user
    content: Hi, this is Priya from Halden Studio. Something looks wrong with our billing this month.
  - role: assistant
    content: Hi Priya, happy to help. Which invoice or charge looks wrong to you?
  - role: user
    content: >-
      We upgraded to Growth on the 4th and since then there are two charges of EUR 249 on our Visa,
      two days apart. We only expected one.
  - role: assistant
    content: >-
      Thanks. I can see invoice INV-2291 for EUR 249 on 4 November, which is the prorated upgrade
      charge, and INV-2304 for EUR 249 on 6 November. Let me check what created INV-2304.
  - role: user
    content: >-
      Also, our accountant noticed that neither invoice shows our VAT number, so she cannot reclaim
      the VAT on them.
  - role: assistant
    content: >-
      Understood, that is a separate fix. Once your VAT number is on your billing profile, the
      invoices can be reissued to include it. Do you have the number to hand?
  - role: user
    content: Not right now, I will dig it out. Back to the charges, was the second one a mistake?
  - role: assistant
    content: >-
      INV-2304 was created by an automatic payment retry after your card was briefly declined on the
      4th, even though the first payment went through in the end. So yes, it is a duplicate charge for
      the same upgrade.
  - role: user
    content: That is frustrating. We are a small agency and EUR 249 matters to us.
  - role: assistant
    content: >-
      I understand, and I am sorry about the trouble. A duplicate charge qualifies for a full refund.
      Do you want it back on the original Visa, or as credit on your account?
  - role: user
    content: Hold on, let me check with our managing director how she wants it handled.
  - role: assistant
    content: Of course, take your time.
  - role: user
    content: While I wait, does the Growth plan include the client portal? Our designers asked.
  - role: assistant
    content: >-
      Yes. Growth includes the client portal with custom branding and up to 50 client logins, so your
      current setup is covered.
  - role: user
    content: >-
      Great. Our designers also want to export a monthly report of hours per client. Is that something
      the Growth plan can do, or do we need a different plan for it?
  - role: assistant
    content: >-
      Growth includes the time-report export. Under Reports, choose Hours by client, pick the month and
      export it as CSV or PDF. Scheduled monthly exports by email are part of the Scale plan.
  - role: user
    content: Fine, we can run it by hand. Could we add two more seats this month without another surprise charge?
  - role: assistant
    content: >-
      Adding seats creates a prorated charge for the rest of your billing year. You can pay it now or
      have it added to your next invoice instead, which avoids a separate charge.
  - role: user
    content: Let us leave the seats for now. Are invoices synced to Xero automatically?
  - role: assistant
    content: >-
      Yes. Your Xero integration receives each invoice when it is finalised, and a regenerated invoice
      replaces the earlier version there.
  - role: user
    content: >-
      Our external accountant, Marco, should get invoice emails too. At the moment only I receive them
      and I keep forwarding them to him.
  - role: assistant
    content: >-
      You can add Marco as a billing contact under Settings, Billing, Contacts. He will receive invoices
      and refund confirmations without needing a seat. Would you like me to walk you through it?
  - role: user
    content: No need, I will do it later today. Our MD says refund the duplicate to the card, not as credit.
  - role: assistant
    content: >-
      Noted: the refund goes back to the Visa ending 4417. I will confirm the amount and the invoice
      with you before processing anything.
  - role: user
    content: >-
      Found the VAT number, it is NL859245613B01. Please make sure the corrected invoices are addressed
      to Halden Studio B.V.
  - role: assistant
    content: >-
      Thank you. I have the VAT number NL859245613B01 and the legal name Halden Studio B.V. I can
      update your billing details and regenerate INV-2291 once you confirm.
  - role: user
    content: One more thing, will the refund show up before our month-end close?
  - role: assistant
    content: >-
      It depends on your bank. I will give you the expected timing when I confirm the refund, and you
      will get an email with the refund reference.

few_shot:
  - id: ex-refund-after-cancel
    score: 0.8
    user: I cancelled last month but was charged again. Can I get that back?
    assistant: >-
      I am sorry about that. Charges made after a cancellation are refunded in full [kb-cancellation#2].
      I can see INV-1187 for EUR 49 dated after your cancellation. Shall I refund it to your original
      card? Card refunds usually show within 5 to 10 business days [kb-refund-timelines#1].
  - id: ex-vat-old-invoices
    score: 0.7
    user: Can you add our VAT number to last year's invoices?
    assistant: >-
      Yes for invoices from the last 12 months [kb-vat-invoices#1]. First I will add the VAT number to
      your billing profile, then regenerate the invoices; their numbers stay the same. Which invoices
      do you need, and can you confirm the VAT number?
  - id: ex-price-increase
    score: 0.4
    user: Why is this invoice higher than usual?
    assistant: >-
      Your invoice includes a prorated charge for two seats added on 12 March [kb-proration#1]. You
      pay only for the remaining days of your billing year. Would you like a breakdown by line item?

query: >-
  Yes, please go ahead: refund the duplicate EUR 249 charge on INV-2304 to our Visa, and send us the
  corrected invoice with our VAT number. Roughly how long will the refund take to arrive?
